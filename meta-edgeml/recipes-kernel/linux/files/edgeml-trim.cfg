# EdgeML kernel trim, iteration 1 (revised after the first build failed, see docs/decisions.md).
# Each group is switched off with "is not set". Written against the real tegra_defconfig by running the kernel's own
# configuration tool (make alldefconfig) on it, so implicit selects are accounted for: 1,721 built-in options become
# 1,395 and 665 modules become 368. The final list of what stayed is results/kernel/config-after.txt.

# Debugging and tracing left on by the default configuration (no effect on the demo, DEBUG_VM also slows the memory manager). FTRACE and DEBUG_KMEMLEAK stay for now: tracing is used by NVIDIA drivers, and KMEMLEAK is off by default at run time.
# CONFIG_DEBUG_VM is not set
# CONFIG_DEBUG_INFO is not set
# CONFIG_DEBUG_BUGVERBOSE is not set
# CONFIG_KEXEC is not set
# CONFIG_MAGIC_SYSRQ is not set
# CONFIG_KALLSYMS_ALL is not set

# DEBUG_FS was only on because DEBUG_KMEMLEAK selected it; the NVIDIA cpufreq, clock and power-sensor drivers need it, so pin it.
CONFIG_DEBUG_FS=y

# Bluetooth: the Intel card's Bluetooth half is not used. Its Wi-Fi half (iwlwifi) stays.
# CONFIG_BT is not set

# Sound: the demo is headless.
# CONFIG_SOUND is not set

# SHIELD accessory HID drivers: NVIDIA vendor drivers that use ALSA sound functions without declaring dependency on SND in Kconfig
# CONFIG_HID_SHIELD_REMOTE is not set
# CONFIG_HID_SHIELD_BLAKE is not set
# CONFIG_HID_NVIDIA_STAND is not set

