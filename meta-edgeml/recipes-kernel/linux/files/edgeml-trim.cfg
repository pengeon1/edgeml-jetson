# Network subsystems with no hardware or use here (InfiniBand, IrDA, PPP). Left on deliberately: ATA (switching it off also switches off SCSI and USB storage) and CAN (the NVIDIA M_TTCAN driver selects STAGING, which holds the INA3221 power-sensor driver that tegrastats needs).
# CONFIG_INFINIBAND is not set
# CONFIG_IRDA is not set
# CONFIG_PPP is not set

# Filesystems the image does not use (ext4, vfat, overlayfs, fuse, configfs stay).
# CONFIG_BTRFS_FS is not set
# CONFIG_NTFS_FS is not set
# CONFIG_NFS_FS is not set
# CONFIG_9P_FS is not set

# Keep these built in, as in the original configuration. Removing built-in network, NFS and USB-serial
# drivers made the kernel turn the USB core, host controllers, USB storage and several crypto and HID
# options into modules (found by running the kernel's own configuration tool on the real tegra_defconfig).
