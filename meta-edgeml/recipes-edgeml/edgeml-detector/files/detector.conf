# Settings for edgeml-detector (read by systemd, one NAME=value per line).
# Broker on the laptop, reached over the USB network (laptop = 192.168.55.100).
# With the Ethernet sharing setup the laptop is 10.42.0.1 instead.
EDGEML_BROKER=192.168.55.100
EDGEML_PORT=1883
EDGEML_TOPIC=edgeml/detections
EDGEML_ENGINE=/var/lib/edgeml/yolov5n_fp16.engine
EDGEML_CAMERA=/dev/video0
EDGEML_CONF=0.35
EDGEML_NMS=0.45
